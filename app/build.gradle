plugins {
    id 'com.android.application'
}

android {
    namespace 'com.torretti.alarmsms'
    compileSdk 34

    defaultConfig {
        applicationId 'com.torretti.alarmsms'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        fixed {
            storeFile file('allarme.keystore')
            storePassword 'allarme123'
            keyAlias 'allarme'
            keyPassword 'allarme123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
