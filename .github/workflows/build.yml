name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decrypt signing key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Manca il secret KEYSTORE_PASS (Settings > Secrets and variables > Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in app/allarme.keystore.enc -out app/allarme.keystore -pass env:KEYSTORE_PASS
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AllarmeSMS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Allarme SMS (ultima build)
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
